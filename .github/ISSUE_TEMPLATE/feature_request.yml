name: Feature Request
description: Suggest a new idea, semantic class, or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature! Please describe your use case.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific workflow problem?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the target syntax or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
