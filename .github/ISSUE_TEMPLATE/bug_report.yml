name: Bug Report
description: File a bug report or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report! Please provide detailed information to help reproduce the issue.
  - type: textarea
    id: command
    attributes:
      label: Command & Input
      description: What exact command and input caused the issue?
      placeholder: echo "some text" | snag <target>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What output did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What output or error occurred?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version & OS
      description: Output of `snag --version` and your operating system.
      placeholder: snag 0.1.0 on Linux / macOS / Windows
    validations:
      required: true
